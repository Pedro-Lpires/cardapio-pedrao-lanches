    <title>Painel Atendente</title>

    <!-- Estilos da página: veja GUIA-ESTILOS.md. -->

  <body class="painel-atendente-body">
    <h1>👨‍💼 Painel do Atendente</h1>

    <p id="nome-atendente"></p>

    <hr />

    <!-- ========================= -->
    <!-- MENU PRINCIPAL -->
    <!-- ========================= -->

    <div class="menu-atendente">
      <button onclick="abrirConsumoLocal()">🍔 Consumo no Local</button>

      <button onclick="abrirEntregaAtendente()">🛵 Entrega</button>

      <button onclick="abrirRetiradaAtendente()">📦 Retirada</button>

      <button onclick="abrirComandasAbertas()">📋 Comandas Abertas</button>

      <button type="button" id="btn-chamados-mesa" onclick="abrirChamadosMesaAtendente()">
        🔔 Chamados
        <span id="contador-chamados-mesa" style="display: none"> 0 </span>
      </button>

      <button onclick="logoutAtendente()">Sair</button>
    </div>

    <!-- ========================= -->
    <!-- CONTEÚDO DAS TELAS -->
    <!-- ========================= -->

    <div id="area-consumo-local" style="display: none"></div>

    <div id="area-mesa-atendente" style="display: none"></div>

    <div
      id="area-comanda-atendente"
      style="
        display: none;
        margin-top: 20px;
        padding: 15px;
        border: 1px solid #444;
        border-radius: 10px;
      "
    ></div>

    <div id="area-produtos-comanda" style="display: none"></div>
    <div id="area-entrega-atendente" style="display: none"></div>
    <div id="area-retirada-atendente" style="display: none"></div>
    <div id="area-chamados-mesa-atendente" style="display: none"></div>
