<!doctype html>
<html lang="pt-BR">
  <head>
    <script src="js/imagens-webp.js?v=20261031-2"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Funcionário — Pedrão Lanches</title>
    <link rel="icon" type="image/webp" href="images/logo-trailer.webp" />

    <!-- Estilos da página: veja GUIA-ESTILOS.md. -->
    <link rel="stylesheet" href="css/paginas/atendente.css?v=20261102-7" />
  </head>
  <body>
    <main class="login-atendente funcionario-login-ui">
      <h1>Pedrão Lanches</h1>
      <p>Acesso do funcionário</p>
      <form id="login-funcionario" onsubmit="event.preventDefault();loginAtendente()">
        <label for="codigo-atendente">Código de funcionário</label>
        <input
          type="password"
          id="codigo-atendente"
          placeholder="Digite seu código"
          autocomplete="current-password"
          required
        />
        <label class="funcionario-lembrar-ui"
          ><input type="checkbox" id="lembrar-funcionario" />Salvar acesso neste aparelho</label
        >
        <small>Use apenas no aparelho do funcionário. O código não será salvo.</small>
        <button type="submit" id="entrar-funcionario">Entrar</button>
      </form>
      <p id="login-funcionario-status" role="status" aria-live="polite"></p>
      <section id="destinos-funcionario" hidden aria-label="Escolha onde trabalhar">
        <p id="boas-vindas-funcionario"></p>
        <div class="funcionario-destinos-ui">
          <button type="button" id="destino-chapa" onclick="abrirDestinoFuncionarioUI('chapa')">
            Chapa<span>Cozinha e produção</span>
          </button>
          <button
            type="button"
            id="destino-atendimento"
            onclick="abrirDestinoFuncionarioUI('atendimento')"
          >
            Atendimento<span>Painel do atendente</span>
          </button>
        </div>
        <button type="button" class="funcionario-trocar-ui" onclick="trocarCodigoFuncionarioUI()">
          Trocar código
        </button>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="js/ui-comum.js?v=20261102-7"></script>
    <script src="js/firebase-operacao.js"></script>
    <script src="js/funcionario-acesso.js?v=20261029-4"></script>
    <script src="js/funcionario-login.js?v=20261102-3"></script>
  </body>
</html>
