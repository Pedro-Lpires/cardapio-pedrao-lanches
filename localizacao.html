<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Escolha Waze ou Google Maps para abrir o destino da entrega do Pedrão Lanches."
    />
    <title>Localização da entrega · Pedrão Lanches</title>
    <link rel="icon" type="image/webp" href="images/logo-trailer.webp" />
    <link rel="stylesheet" href="css/paginas/localizacao.css?v=20261102-7" />
    <script src="js/localizacao.js?v=20261031-3" defer></script>
  </head>
  <body>
    <main>
      <img src="images/logo-trailer.webp" alt="Pedrão Lanches" width="76" height="76" />
      <p class="marca">PEDRÃO LANCHES</p>
      <h1>Localização da entrega</h1>
      <p id="descricao-localizacao">Como você prefere abrir o destino?</p>
      <nav id="opcoes-localizacao" aria-label="Escolher aplicativo" hidden>
        <a id="abrir-waze" rel="noreferrer">Abrir no Waze <span aria-hidden="true">↗</span></a>
        <a id="abrir-maps" rel="noreferrer"
          >Abrir no Google Maps <span aria-hidden="true">↗</span></a
        >
      </nav>
      <p id="erro-localizacao" role="status" hidden>
        O link está incompleto. Peça ao atendente para reenviar a localização.
      </p>
    </main>
  </body>
</html>
