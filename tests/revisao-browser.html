<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Revisão isolada — Pedrão</title>
    <style>
      body {
        background: #292929;
        color: white;
        font: 16px Arial;
        margin: 16px;
      }
      iframe {
        width: 375px;
        height: 667px;
        background: #111;
        display: block;
        margin-top: 16px;
        border: 1px solid #888;
      }
      button,
      select {
        padding: 10px;
        margin: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Revisão isolada</h1>
    <p>
      Dados fictícios em memória. Sem conexão com o Firebase e sem mensagens para clientes reais.
    </p>
    <label
      >Página<select id="pagina">
        <option value="index.html">Cardápio</option>
        <option value="admin.html">Admin</option>
        <option value="painel-atendente.html">Atendente</option>
        <option value="atendente.html">Login do atendente</option>
        <option value="autoatendimento.html">Autoatendimento</option>
        <option value="autoatendimento.html?mesa=6">Autoatendimento · mesa 6 nova</option>
        <option value="financeiro.html">Financeiro</option>
        <option value="cozinha.html">Chapeiro celular</option>
        <option value="cozinha.html?modo=monitor">Chapeiro monitor</option>
      </select></label
    ><button onclick="largura(320)">320 px</button><button onclick="largura(375)">375 px</button
    ><button onclick="largura(430)">430 px</button>
    <button onclick="largura(375, 440)">375 × 440 px</button>
    <button onclick="largura(1024)">1024 px</button>
    <button onclick="largura(1200)">1200 px</button>
    <button onclick="largura(1440)">1440 px</button>
    <button onclick="largura(1920)">1920 px</button>
    <button
      onclick="frame.contentWindow.postMessage({tipo: 'revisao-medir-layout'}, location.origin)"
    >
      Conferir largura
    </button>
    <p id="medidas-layout" role="status"></p>
    <output id="diagnostico-som" aria-live="polite"></output>
    <button
      id="simular-cozinha"
      hidden
      onclick="frame.contentWindow.postMessage({tipo:'revisao-nova-leva-cozinha'},location.origin)"
    >
      Enviar nova leva à chapa
    </button>
    <button
      id="simular-chamado-normal"
      hidden
      onclick="frame.contentWindow.postMessage({tipo:'revisao-chamado-mesa',chamadoTipo:'atendente'},location.origin)"
    >
      Simular chamar atendente
    </button>
    <button
      id="simular-chamado-conta"
      hidden
      onclick="frame.contentWindow.postMessage({tipo:'revisao-chamado-mesa',chamadoTipo:'conta'},location.origin)"
    >
      Simular pedir a conta
    </button>
    <div id="simular-pedidos-site" hidden>
      <button
        onclick="frame.contentWindow.postMessage({tipo:'revisao-pedido-site',pedidoTipo:'Entrega'},location.origin)"
      >
        Receber entrega do site
      </button>
      <button
        onclick="frame.contentWindow.postMessage({tipo:'revisao-pedido-site',pedidoTipo:'Retirada'},location.origin)"
      >
        Receber retirada do site
      </button>
      <button
        onclick="frame.contentWindow.postMessage({tipo:'revisao-pedido-site',pedidoTipo:'Local'},location.origin)"
      >
        Receber consumo no local do site
      </button>
    </div>
    <p>Senha fictícia dos painéis: teste1234</p>
    <label
      >Cenário<select id="cenario">
        <option value="normal">Normal</option>
        <option value="seguranca-protegida">Proteção · APIs reais com dados fictícios</option>
        <option value="beneficios-entrega">Benefícios · crédito fictício de entrega</option>
        <option value="rank-mensal">Rank mensal · Prata com R$310 neste mês</option>
        <option value="cupons-rank">Cupons por rank · exemplos fictícios</option>
        <option value="funcionario-chapa">Funcionário · só Chapa</option>
        <option value="funcionario-atendimento">Funcionário · só Atendimento</option>
        <option value="atendimento-edicao">Atendimento · edição e vínculos antigos</option>
        <option value="lento">Busca lenta</option>
        <option value="falha">Falha ao buscar mensagens</option>
        <option value="catalogo-atual">Catálogo atualizado · dados locais</option>
        <option value="combos">Combos conferidos nas imagens</option>
        <option value="cda-inativo">Conta com CDA ainda não ativado</option>
        <option value="beneficios">Magos, benefícios e chamados</option>
        <option value="loja-fechada">Loja fechada pelo ADM</option>
        <option value="entrega-distante">Entrega urbana · 12 km fictícios</option>
        <option value="entrega-fora-area">Entrega urbana · 22 km fictícios</option>
        <option value="comanda-mista">Comanda com itens diferentes</option>
        <option value="chapeiro-agrupado">Chapeiro · dez lanches + novo envio</option>
        <option value="chapeiro-obs-grupo">
          Chapeiro · nove lanches e observação de dois + batata
        </option>
        <option value="auto-pedido-enviado">Autoatendimento · retomar pedido enviado</option>
      </select></label
    >
    <button
      id="retomar"
      onclick="frame.contentDocument.dispatchEvent(new Event('visibilitychange'))"
    >
      Simular retorno ao site
    </button>
    <button
      id="subir-nivel"
      hidden
      onclick="frame.contentWindow.postMessage({tipo: 'revisao-subir-nivel'}, location.origin)"
    >
      Simular próximo rank
    </button>
    <button
      id="enviar-cupom-teste"
      hidden
      onclick="frame.contentWindow.postMessage({tipo: 'revisao-enviar-cupom'}, location.origin)"
    >
      Receber cupom fictício
    </button>
    <button
      id="previa-ativacao"
      hidden
      onclick="frame.contentWindow.postMessage({tipo: 'revisao-previa-ativacao'}, location.origin)"
    >
      Prévia da ativação do CDA
    </button>
    <button
      onclick="frame.contentWindow.postMessage({tipo: 'revisao-alternar-loja'}, location.origin)"
    >
      Simular abrir / fechar loja
    </button>
    <button id="recarregar-auto-teste" hidden onclick="frame.srcdoc=frame.srcdoc">
      Recarregar atendimento de teste
    </button>
    <button
      id="encerrar-auto-teste"
      hidden
      onclick="frame.contentWindow.postMessage({tipo:'revisao-encerrar-atendimento-auto'},location.origin)"
    >
      Encerrar atendimento de teste
    </button>
    <iframe id="mobile" title="Prévia isolada"></iframe>
    <script>
      const frame = document.getElementById("mobile");
      function largura(n, altura) {
        frame.style.width = n + "px";
        frame.style.height = (altura || (n >= 900 ? 640 : 667)) + "px";
      }
      window.addEventListener("message", (evento) => {
        if (
          evento.source === frame.contentWindow &&
          evento.origin === location.origin &&
          evento.data?.tipo === "revisao-som"
        ) {
          document.getElementById("diagnostico-som").textContent =
            `Áudio real: ${evento.data.notas} notas iniciadas pelo navegador.`;
          return;
        }
        if (
          evento.source !== frame.contentWindow ||
          evento.origin !== location.origin ||
          evento.data?.tipo !== "revisao-medidas-layout"
        )
          return;
        document.getElementById("medidas-layout").textContent = evento.data.texto;
      });
      async function abrir() {
        const retomadaAuto = document.getElementById("cenario").value === "auto-pedido-enviado";
        document.getElementById("recarregar-auto-teste").hidden = !retomadaAuto;
        document.getElementById("encerrar-auto-teste").hidden = !retomadaAuto;
        document.getElementById("diagnostico-som").textContent = "";
        document.getElementById("simular-cozinha").hidden = !document
          .getElementById("pagina")
          .value.startsWith("cozinha.html");
        const atendente = document.getElementById("pagina").value === "painel-atendente.html";
        document.getElementById("simular-chamado-normal").hidden = !atendente;
        document.getElementById("simular-chamado-conta").hidden = !atendente;
        document.getElementById("simular-pedidos-site").hidden = !atendente;
        document.getElementById("subir-nivel").hidden =
          document.getElementById("cenario").value !== "beneficios";
        document.getElementById("enviar-cupom-teste").hidden =
          document.getElementById("cenario").value !== "beneficios";
        document.getElementById("previa-ativacao").hidden =
          document.getElementById("cenario").value !== "beneficios";
        const pagina = document.getElementById("pagina").value;
        let html = await (await fetch("../" + pagina)).text();
        const combosConferidos = ["combos", "comanda-mista"].includes(
          document.getElementById("cenario").value,
        )
          ? await (await fetch("../scripts/combos-conferidos.json")).json()
          : null;
        const catalogoAtual =
          document.getElementById("cenario").value === "catalogo-atual"
            ? await (await fetch("../scripts/catalogo-precos-consulta.json")).json()
            : null;
        html = html.replace(
          /<script\s+src="https:\/\/www.gstatic.com\/firebasejs[^\"]*"\s*>\s*<\/script>/g,
          "",
        );
        html = html.replace(
          "<head>",
          "<head><script>window.combosConferidosFixture=" +
            JSON.stringify(combosConferidos) +
            ";window.catalogoAtualFixture=" +
            JSON.stringify(catalogoAtual) +
            ';<\/script><base href="' +
            new URL("../", location.href) +
            '"><script src="tests/firebase-ui-mock.js' +
            "?" +
            new URLSearchParams({
              modo: pagina.includes("modo=monitor") ? "monitor" : "",
              mesa: pagina.includes("mesa=6") ? "6" : "2",
              cenario: document.getElementById("cenario").value,
            }) +
            '"><\/script>',
        );
        frame.srcdoc = html;
      }
      document.getElementById("pagina").onchange = abrir;
      document.getElementById("cenario").onchange = abrir;
      const parametros = new URLSearchParams(location.search);
      for (const nome of ["pagina", "cenario"]) {
        const campo = document.getElementById(nome);
        if (Array.from(campo.options).some((o) => o.value === parametros.get(nome)))
          campo.value = parametros.get(nome);
      }
      abrir();
    </script>
  </body>
</html>
