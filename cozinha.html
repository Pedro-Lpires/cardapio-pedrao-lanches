<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chapeiro — Pedrão Lanches</title>
    <!-- Estilos da página: veja GUIA-ESTILOS.md. -->
    <link rel="stylesheet" href="css/paginas/cozinha.css?v=20261024-9" />
  </head>
  <body class="cozinha-body">
    <!-- HEADER — cabeçalho da página -->
    <header>
      <h1>Chapa Pedrão</h1>
      <p id="quantidade-cozinha" aria-live="polite">Conectando…</p>
      <div class="operacao-acoes cozinha-controle">
        <a href="cozinha.html?modo=monitor" target="_blank" rel="noopener">Abrir modo monitor</a
        ><a href="cozinha.html">Modo celular</a>
      </div>
      <div class="cozinha-controle cozinha-acoes">
        <button
          type="button"
          id="cozinha-remover"
          aria-pressed="false"
          onclick="alternarRemocaoCozinhaOperacao()"
        >
          Excluir</button
        ><button type="button" onclick="limparTelasProducaoOperacao()">Limpar</button
        ><button type="button" onclick="abrirConcluidosCozinhaOperacao()">Concluído</button>
      </div>
    </header>
    <section id="cozinha-acesso" hidden>
      <form onsubmit="event.preventDefault();entrarCozinhaOperacao()">
        <label for="codigo-cozinha">Código de funcionário</label
        ><input
          id="codigo-cozinha"
          type="password"
          autocomplete="current-password"
          required
        /><button type="submit">Conectar cozinha</button>
      </form>
      <p id="cozinha-acesso-status" role="status"></p>
    </section>
    <!-- MAIN — conteúdo principal -->
    <main id="fila-cozinha" aria-live="polite"></main>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/ui-comum.js?v=20261024-3"></script>
    <script src="js/firebase-operacao.js"></script>
    <script src="js/operacao.js?v=20261024-9"></script>
    <script src="js/app-ui.js?v=20261023-19"></script>
    <script src="js/raspadinhas-recuperacao.js?v=20261020-3"></script>
    <script src="js/raspadinhas.js?v=20261024-9"></script>
    <script src="js/fluxos-interface.js?v=20261024-1"></script>
    <script src="js/janelas-fluxos.js?v=20261023-19"></script>
  </body>
</html>
